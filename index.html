# AI Voice Command Interface

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Command Interface</title>
</head>
<body>
    <h1>AI Voice Command Interface</h1>
    <button id="start-button">शुरू करें</button>
    <p id="status">स्थिति: तैयार</p>
    <script>
        const startButton = document.getElementById('start-button');
        const statusText = document.getElementById('status');
        
        startButton.addEventListener('click', () => {
            statusText.textContent = 'स्थिति: सुनना शुरू करें...';
            startRecognition();
        });

        function startRecognition() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const command = event.results[0][0].transcript;
                statusText.textContent = `आपने कहा: ${command}`;
                // Add AI processing logic here
            };

            recognition.onerror = (event) => {
                statusText.textContent = 'स्थिति: त्रुटि हुई';
            };

            recognition.start();
        }
    </script>
</body>
</html>
