# AI Voice Command Interface

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Command Interface</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>AI Voice Command Interface</h1>
    <button id="start-record-btn">Start Recording</button>
    <p id="status"></p>
    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        
        recognition.lang = 'hi-IN'; // Set language to Hindi
        recognition.interimResults = false;

        document.getElementById('start-record-btn').addEventListener('click', () => {
            recognition.start();
            document.getElementById('status').innerText = "Listening...";
        });

        recognition.onresult = (event) => {
            const command = event.results[0][0].transcript;
            document.getElementById('status').innerText = `You said: ${command}`;
            executeCommand(command);
        };

        recognition.onerror = (event) => {
            document.getElementById('status').innerText = `Error occurred in recognition: ${event.error}`;
        };

        function executeCommand(command) {
            // Add your command execution logic here
            if (command.includes("खोलो")) {
                // Example command to open an application
                alert("Opening application...");
            } else if (command.includes("बंद करो")) {
                // Example command to close an application
                alert("Closing application...");
            } else {
                alert("Command not recognized.");
            }
        }
    </script>
</body>
</html>
